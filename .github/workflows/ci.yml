name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel build
        run: bazel build --lockfile_mode=error //...
